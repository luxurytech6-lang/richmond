<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0d2b12"/>
  <title>CropGuard — Offline</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --forest:#0d2b12; --leaf:#3dba6f; --cream:#f5f0e8; --soil:#8aad8f; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sora', system-ui, sans-serif;
      background: var(--forest);
      color: var(--cream);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    svg { margin-bottom: 28px; opacity: 0.75; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
    p  { font-size: 0.9rem; color: var(--soil); line-height: 1.6; max-width: 280px; margin-bottom: 32px; }
    button {
      background: var(--leaf);
      color: var(--forest);
      border: none;
      padding: 13px 28px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <svg width="64" height="64" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M14 2C14 2 6 8 6 16a8 8 0 0016 0C22 8 14 2 14 2z" fill="#3dba6f"/>
    <path d="M14 10v12M10 14c1.5-1 4-1.5 4-1.5S16.5 13 18 14" stroke="#0d2b12" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <h1>You're offline</h1>
  <p>No internet connection. Your cached scans are still available when you go back.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
